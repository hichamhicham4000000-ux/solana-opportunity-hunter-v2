name: Project Smoke Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m compileall -q .

      - name: Import core modules
        run: |
          python -c "from config.settings import settings"
          python -c "from database.db import init_db"
          python -c "from database.models import Base"
          python -c "from analysis.engine import analyze_token, quick_score"
          python -c "from bot.main import OpportunityHunterBot"

      - name: Smoke test passed
        run: |
          echo "Solana Opportunity Hunter smoke test passed."
