name: Project Smoke Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m compileall -q .

      - name: Import core modules
        run: |
          python -c "from config.settings import settings"
          python -c "from database.db import init_db"
          python -c "from database.models import Base, SmartMoneyWallet"
          python -c "from analysis.engine import analyze_token, quick_score"
          python -c "from analysis.discovery import Candidate, OpportunityDiscovery"
          python -c "from analysis.ranker import RankedOpportunity"
          python -c "from analysis.security_gate import SecurityDecision"
          python -c "from analysis.smart_money_intelligence import SmartMoneyAssessment"
          python -c "from analysis.market_intelligence import MarketIntelligence"
          python -c "from analysis.manipulation import ManipulationAssessment"
          python -c "from analysis.deep_intelligence import DeepIntelligenceEngine"

      - name: Run integration test
        run: |
          python - <<'PY'
          import asyncio
          from types import SimpleNamespace

          import analysis.deep_intelligence as di

          from analysis.discovery import (
              Candidate,
              OpportunityDiscovery,
          )

          from analysis.ranker import RankedOpportunity

          from analysis.security_gate import SecurityDecision

          from analysis.smart_money_intelligence import (
              SmartMoneyAssessment,
          )


          MINT = "11111111111111111111111111111111"


          # ------------------------------------------------------
          # Fake base analysis
          # ------------------------------------------------------

          async def fake_analyze_token(mint):
              assert mint == MINT

              return {
                  "token_mint": mint,
                  "token_name": "Integration Test Token",
                  "token_symbol": "TEST",
                  "total_score": 80.0,
                  "risk_label": "LOW",
                  "risk_desc": "Integration test",
                  "data_quality": 90.0,
                  "estimated_criteria": [],
                  "criteria": {},
                  "all_flags": [],
              }


          # ------------------------------------------------------
          # Fake Smart Money
          # ------------------------------------------------------

          async def fake_smart_money_high(mint):
              assert mint == MINT

              return SmartMoneyAssessment(
                  mint=mint,
                  score=100.0,
                  confidence=100.0,
                  state="STRONG",
                  known_wallet_count=5,
                  active_known_wallet_count=5,
                  total_known_holder_amount=500000.0,
                  holder_coverage=25.0,
              )


          async def fake_smart_money_low(mint):
              assert mint == MINT

              return SmartMoneyAssessment(
                  mint=mint,
                  score=0.0,
                  confidence=100.0,
                  state="NONE",
              )


          # ------------------------------------------------------
          # Fake Market Intelligence
          #
          # We use deterministic values so the CI test verifies
          # the new scoring architecture instead of depending on
          # implementation details of market heuristics.
          # ------------------------------------------------------

          fake_market = SimpleNamespace(
              market_score=100.0,
              momentum_score=100.0,
              volume_score=100.0,
              pressure_score=100.0,
              liquidity_score=100.0,
              structure_score=100.0,
              breakout_score=100.0,
              market_state="STRONG",
              momentum_state="STRONG",
              volume_state="HIGH",
              pressure_state="HEALTHY_BUY_PRESSURE",
              breakout_state="POTENTIAL_BREAKOUT",
              reasons=["Integration market signal"],
              warnings=[],
              metrics={},
          )


          class FakeMarketEngine:

              def analyze(self, candidate):
                  assert candidate.mint == MINT
                  return fake_market


          # ------------------------------------------------------
          # Fake Manipulation Assessment
          #
          # Zero manipulation risk is intentional for the positive
          # integration scenario.
          # ------------------------------------------------------

          fake_manipulation = SimpleNamespace(
              mint=MINT,
              manipulation_score=0.0,
              risk_level="MINIMAL",
              suspicious=False,
              severe=False,
              signals=[],
              reasons=[],
              warnings=[],
              limitations=[],
          )


          class FakeManipulationEngine:

              def analyze(self, candidate, market=None):
                  assert candidate.mint == MINT
                  assert market is fake_market
                  return fake_manipulation


          async def main():

              # ==================================================
              # 1. Discovery layer
              # ==================================================

              candidate = Candidate(
                  mint=MINT,
                  source="integration_test",
                  name="Integration Test Token",
                  symbol="TEST",
                  liquidity_usd=100000.0,
                  volume_24h=1000000.0,
                  price_change_5m=5.0,
                  price_change_1h=10.0,
                  txns_buys=70,
                  txns_sells=30,
                  maker_count=500,
              )

              discovery = OpportunityDiscovery(
                  max_candidates=10
              )

              stored = await discovery.add_candidate(
                  candidate
              )

              assert stored.discovery_score > 0
              assert stored.mint == MINT

              candidates = await discovery.get_candidates()

              assert len(candidates) == 1
              assert candidates[0].mint == MINT

              print(
                  "Discovery layer passed:",
                  stored.discovery_score,
              )


              # ==================================================
              # 2. Ranking layer
              # ==================================================

              ranked = RankedOpportunity(
                  candidate=stored,
                  rank_score=80.0,
                  priority="VERY_HIGH",
                  reasons=[
                      "Integration test ranking"
                  ],
                  warnings=[],
              )

              assert ranked.candidate.mint == MINT
              assert ranked.rank_score == 80.0

              print(
                  "Ranking layer passed:",
                  ranked.rank_score,
              )


              # ==================================================
              # 3. Security Gate
              # ==================================================

              passing_gate = SecurityDecision(
                  mint=MINT,
                  passed=True,
                  status="PASS",
                  risk_score=10.0,
                  reasons=[],
                  warnings=[],
                  checks={},
              )

              assert passing_gate.passed is True

              print(
                  "Security Gate PASS case passed."
              )


              # ==================================================
              # 4. Inject deterministic test dependencies
              # ==================================================

              di.analyze_token = fake_analyze_token

              di.assess_smart_money = (
                  fake_smart_money_high
              )

              di.market_intelligence = (
                  FakeMarketEngine()
              )

              di.manipulation_engine = (
                  FakeManipulationEngine()
              )

              engine = di.DeepIntelligenceEngine()


              # ==================================================
              # 5. Deep Intelligence + STRONG Smart Money
              # ==================================================

              high_result = await engine.analyze(
                  ranked=ranked,
                  security_decision=passing_gate,
              )

              assert high_result.mint == MINT

              assert (
                  high_result.smart_money_score
                  == 100.0
              )

              assert (
                  high_result.smart_money_state
                  == "STRONG"
              )

              assert (
                  high_result.market_score
                  == 100.0
              )

              assert (
                  high_result.manipulation_score
                  == 0.0
              )


              # --------------------------------------------------
              # New Deep Intelligence weights:
              #
              # Security       25%
              # Ranking        15%
              # Discovery       8%
              # Data Quality    7%
              # Gate             5%
              # Smart Money     15%
              # Market          25%
              # --------------------------------------------------

              expected_high_score = round(
                  80.0 * 0.25
                  + 80.0 * 0.15
                  + stored.discovery_score * 0.08
                  + 90.0 * 0.07
                  + 100.0 * 0.05
                  + 100.0 * 0.15
                  + 100.0 * 0.25,
                  1,
              )

              assert (
                  high_result.opportunity_score
                  == expected_high_score
              )

              print(
                  "High Smart Money result:",
                  high_result.opportunity_score,
              )


              # ==================================================
              # 6. Smart Money must affect Opportunity Score
              # ==================================================

              di.assess_smart_money = (
                  fake_smart_money_low
              )

              low_result = await engine.analyze(
                  ranked=ranked,
                  security_decision=passing_gate,
              )

              assert (
                  low_result.smart_money_score
                  == 0.0
              )

              assert (
                  low_result.smart_money_state
                  == "NONE"
              )


              expected_low_score = round(
                  80.0 * 0.25
                  + 80.0 * 0.15
                  + stored.discovery_score * 0.08
                  + 90.0 * 0.07
                  + 100.0 * 0.05
                  + 0.0 * 0.15
                  + 100.0 * 0.25,
                  1,
              )

              assert (
                  low_result.opportunity_score
                  == expected_low_score
              )


              score_difference = round(
                  high_result.opportunity_score
                  - low_result.opportunity_score,
                  1,
              )

              assert score_difference == 15.0

              assert (
                  high_result.opportunity_score
                  > low_result.opportunity_score
              )

              print(
                  "Smart Money scoring passed:",
                  f"{low_result.opportunity_score}"
                  f" -> "
                  f"{high_result.opportunity_score}",
                  f"(difference={score_difference})",
              )


              # ==================================================
              # 7. Security Gate must override everything
              # ==================================================

              failing_gate = SecurityDecision(
                  mint=MINT,
                  passed=False,
                  status="FAIL",
                  risk_score=95.0,
                  reasons=[
                      "Security test blocker"
                  ],
                  warnings=[],
                  checks={},
              )

              di.assess_smart_money = (
                  fake_smart_money_high
              )

              blocked_result = await engine.analyze(
                  ranked=ranked,
                  security_decision=failing_gate,
              )

              assert (
                  blocked_result.decision
                  == "AVOID"
              )

              assert (
                  blocked_result.opportunity_score
                  == 0.0
              )

              assert (
                  blocked_result.smart_money_state
                  == "NOT_ANALYZED"
              )

              assert blocked_result.blockers

              print(
                  "Security override passed:"
                  " FAIL + STRONG Smart Money -> AVOID"
              )


              # ==================================================
              # 8. Final integration confirmation
              # ==================================================

              print("")
              print(
                  "=========================================="
              )
              print(
                  "FULL INTEGRATION TEST PASSED"
              )
              print(
                  "=========================================="
              )
              print(
                  "Discovery -> Ranking -> Security Gate ->"
              )
              print(
                  "Deep Intelligence -> Smart Money ->"
              )
              print(
                  "Market Intelligence -> Manipulation ->"
              )
              print(
                  "Opportunity Score -> Security Override"
              )
              print(
                  "=========================================="
              )


          asyncio.run(main())
          PY

      - name: Test passed
        run: |
          echo "Solana Opportunity Hunter integration test passed."
